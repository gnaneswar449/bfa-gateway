  <text x="228" y="127" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">BFA Gateway</text>
  <text x="230" y="166" fill="#C7D2FE" font-family="Arial, Helvetica, sans-serif" font-size="21">A secure control plane for AI agent tool calls.</text>
  <g transform="translate(230 201)">
