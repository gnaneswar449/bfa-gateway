  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="1038" cy="86" r="134" fill="#38BDF8" fill-opacity=".10"/>
  <circle cx="1077" cy="254" r="162" fill="#8B5CF6" fill-opacity=".12"/>
  <path d="M752 70H1065M752 160H1118M752 250H1040" stroke="#7DD3FC" stroke-opacity=".35" stroke-width="2" stroke-dasharray="8 9"/>
  <circle cx="776" cy="70" r="7" fill="#34D399" filter="url(#glow)"/>
  <circle cx="971" cy="160" r="7" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="1080" cy="250" r="7" fill="#A78BFA" filter="url(#glow)"/>
  <rect x="76" y="72" width="116" height="116" rx="28" fill="url(#accent)"/>
  <path d="M134 101L164 113V137C164 156 151 171 134 176C117 171 104 156 104 137V113L134 101Z" stroke="#061426" stroke-width="7" stroke-linejoin="round"/>
